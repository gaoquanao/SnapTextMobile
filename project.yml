name: SnapText
options:
  bundleIdPrefix: me.snaptext
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    DEVELOPMENT_TEAM: QGC87Z9JX3

targets:
  SnapText:
    type: application
    platform: iOS
    sources:
      - path: SnapText
      - path: SharedKit
      - path: SnapText/Resources/Assets.xcassets
      - path: SnapText/Resources/PrivacyInfo.xcprivacy
      - path: SnapText/Resources/Localizable.xcstrings
      - path: SnapText/Resources/InfoPlist.xcstrings
    dependencies:
      - target: SnapTextShareExtension
      - target: SnapTextWidgets
    info:
      path: SnapText/Info.plist
      properties:
        CFBundleDisplayName: 拾文
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: 拾文需要访问相册，以读取您最近的截图进行端侧文字识别。
        CFBundleLocalizations:
          - zh-Hans
          - en
          - ja
          - ko
          - es
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.snaptext.photo-refresh
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: SnapText/SnapText.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.snaptext.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.snaptext.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  SnapTextShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SnapTextShareExtension
      - path: SharedKit
      - path: SnapText/Resources/Localizable.xcstrings
      - path: SnapText/Resources/InfoPlist.xcstrings
    info:
      path: SnapTextShareExtension/Info.plist
      properties:
        CFBundleDisplayName: 拾文
        NSExtension:
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 5
    entitlements:
      path: SnapTextShareExtension/SnapTextShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.snaptext.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.snaptext.app.share
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: APP_EXTENSION SHARE_EXTENSION

  SnapTextWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: SnapTextWidgets
      - path: SharedKit
      - path: SnapText/Resources/Localizable.xcstrings
      - path: SnapText/Resources/InfoPlist.xcstrings
    info:
      path: SnapTextWidgets/Info.plist
      properties:
        CFBundleDisplayName: 拾文
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: SnapTextWidgets/SnapTextWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.snaptext.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.snaptext.app.widgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: APP_EXTENSION

  SnapTextTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: SnapText
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SnapText:
    build:
      targets:
        SnapText: all
        SnapTextShareExtension: all
        SnapTextWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SnapTextTests
